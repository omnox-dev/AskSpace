name: CI - Code & Build Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate-and-build:
    name: 🧪 CI - Validate TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Run TypeScript Check & Vite Production Build
        run: npm run build
        env:
          VITE_DEFAULT_AI_PROVIDER: groq
